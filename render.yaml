services:
  - type: web
    name: bharatwatch-server
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: DASHBOARD_PIN
        sync: false
      - key: AGENT_KEY
        sync: false
      - key: DATABASE_PATH
        value: /app/data/bharatwatch.db
      - key: SCREENSHOTS_DIR
        value: /app/data/screenshots
