<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BharatWatch device health</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main><h1>BharatWatch device health</h1><p>Visible sharing of battery, screen state and online status. The device owner can stop sharing at any time.</p>
<form id="loginForm"><label>Dashboard passphrase<input id="passphrase" type="password" autocomplete="current-password" minlength="12" maxlength="256" required></label><button id="loginBtn">Sign in</button></form>
<p id="notice" role="status"></p><section id="dashboard" hidden><dl><dt>Connection</dt><dd id="online">—</dd><dt>Battery</dt><dd id="battery">—</dd><dt>Screen</dt><dd id="screen">—</dd><dt>Last report</dt><dd id="seen">—</dd></dl><button id="logoutBtn">Sign out</button></section></main></body></html>
